<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>廈門按摩會所指南</title>
<style>
  :root{
    --bg:#1C1A17;
    --surface:#241F1A;
    --surface-hi:#2E2721;
    --line:rgba(242,234,217,0.09);
    --copper:#C68A42;
    --copper-soft:rgba(198,138,66,0.16);
    --jade:#5A8271;
    --jade-soft:rgba(90,130,113,0.16);
    --no:#8B5348;
    --no-soft:rgba(139,83,72,0.14);
    --text:#F2EAD9;
    --text-dim:#B4A996;
    --text-mute:#7E7568;
    --serif:"Noto Serif TC","Songti TC","STSong","PMingLiU",serif;
    --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:ui-monospace,"SF Mono","Menlo",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    padding-bottom:48px;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(198,138,66,0.07), transparent 45%),
      radial-gradient(ellipse at 85% 8%, rgba(90,130,113,0.06), transparent 40%);
  }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 78%, rgba(28,26,23,0));
    padding:22px 18px 10px;
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    color:var(--copper); text-transform:uppercase; margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:"";width:14px;height:1px;background:var(--copper);display:inline-block;}
  h1{
    font-family:var(--serif); font-weight:600; font-size:26px; line-height:1.25;
    margin:0 0 4px; letter-spacing:.02em;
  }
  .sub{font-size:13px;color:var(--text-mute);margin:0;}

  .filters{
    display:flex; gap:8px; overflow-x:auto; padding:14px 18px 4px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:100px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--text-dim); font-size:13px; white-space:nowrap; cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--copper-soft); border-color:rgba(198,138,66,0.5); color:var(--copper);
    font-weight:600;
  }

  .toolbar{
    display:flex; gap:8px; align-items:center; overflow-x:auto;
    padding:10px 18px 4px; scrollbar-width:none;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .sort-btn{
    flex:0 0 auto;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:6px 12px; border-radius:8px; font-size:12px; font-family:var(--sans);
    display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap;
  }
  .sort-btn svg{width:11px;height:11px;transition:transform .2s;}
  .sort-btn.desc svg{transform:rotate(180deg);}
  .sort-btn.active{
    background:var(--jade-soft); border-color:rgba(90,130,113,0.5); color:var(--jade); font-weight:600;
  }
  .sort-btn.star-active{
    background:var(--copper-soft); border-color:rgba(198,138,66,0.5); color:var(--copper); font-weight:600;
  }

  .fav-star{
    flex:0 0 auto; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-top:-2px;
  }
  .fav-star svg{width:18px;height:18px; transition:all .15s ease;}
  .fav-star svg path{fill:none; stroke:var(--text-mute); stroke-width:1.6;}
  .fav-star.on svg path{fill:var(--copper); stroke:var(--copper);}

  /* ---------- list ---------- */
  .list{padding:10px 14px 0;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    margin-bottom:10px; overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:12px; padding:14px;
    cursor:pointer;
  }
  .idx{
    font-family:var(--mono); font-size:11px; color:var(--text-mute);
    width:20px; flex:0 0 auto; padding-top:2px;
  }
  .card-main{flex:1; min-width:0;}
  .card-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .name{
    font-family:var(--serif); font-size:16px; font-weight:600; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .price{
    font-family:var(--mono); font-size:13px; color:var(--copper); flex:0 0 auto;
  }
  .card-meta{
    display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap;
  }
  .area{font-size:12px; color:var(--text-mute);}
  .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--text-mute);opacity:.6;}

  .levels{display:inline-flex; gap:3px; align-items:center;}
  .lv-dot{width:5px;height:5px;border-radius:50%;background:var(--copper); opacity:.85;}

  .tag{
    font-size:11px; padding:2px 8px; border-radius:100px; font-weight:600;
    letter-spacing:.02em;
  }
  .tag.yes{background:var(--jade-soft); color:var(--jade);}
  .tag.no{background:var(--no-soft); color:var(--no);}

  .chevron{
    flex:0 0 auto; color:var(--text-mute); transition:transform .25s ease;
    margin-top:2px;
  }
  .card.open .chevron{transform:rotate(90deg); color:var(--copper);}

  .card-body{
    max-height:0; overflow:hidden; transition:max-height .3s ease;
  }
  .card.open .card-body{max-height:900px;}
  .body-inner{padding:2px 14px 16px;}
  .row{
    padding:10px 0; border-top:1px solid var(--line);
  }
  .row-label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
    color:var(--copper); text-transform:uppercase; margin-bottom:4px;
  }
  .row-val{font-size:13.5px; line-height:1.6; color:var(--text-dim);}

  .ov-panel{
    margin-top:12px; border-radius:12px; padding:14px;
    border:1px solid rgba(90,130,113,0.3); background:var(--jade-soft);
  }
  .ov-panel.no{
    border-color:rgba(139,83,72,0.3); background:var(--no-soft);
  }
  .ov-head{
    display:flex; align-items:center; gap:6px; font-family:var(--serif);
    font-size:13.5px; font-weight:600; color:var(--jade); margin-bottom:10px;
  }
  .ov-panel.no .ov-head{color:var(--no);}
  .ov-overview{
    font-size:12.5px; color:var(--text); line-height:1.6; margin-bottom:10px;
    padding-bottom:10px; border-bottom:1px solid rgba(242,234,217,0.1);
  }
  .ov-item{margin-bottom:9px;}
  .ov-item:last-child{margin-bottom:0;}
  .ov-item-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    color:var(--text-mute); text-transform:uppercase; margin-bottom:2px;
  }
  .ov-item-val{font-size:12.5px; color:var(--text-dim); line-height:1.55;}

  .action-row{display:flex; gap:8px; margin-top:14px;}
  .nav-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    flex:1; padding:11px; border-radius:10px;
    background:var(--copper-soft); border:1px solid rgba(198,138,66,0.4);
    color:var(--copper); font-size:13.5px; font-weight:600; font-family:var(--sans);
    text-decoration:none;
  }
  .nav-btn:active{background:rgba(198,138,66,0.28);}
  .nav-btn svg{width:15px;height:15px;flex:0 0 auto;}
  .call-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    flex:1; padding:11px; border-radius:10px;
    background:var(--jade-soft); border:1px solid rgba(90,130,113,0.4);
    color:var(--jade); font-size:13.5px; font-weight:600; font-family:var(--sans);
    text-decoration:none;
  }
  .call-btn:active{background:rgba(90,130,113,0.28);}
  .call-btn svg{width:15px;height:15px;flex:0 0 auto;}
  .call-btn.disabled{opacity:.35; pointer-events:none;}
  .no-phone-note{
    font-size:11px; color:var(--text-mute); text-align:center; margin-top:6px;
  }

  /* empty state */
  .empty{
    text-align:center; padding:60px 20px; color:var(--text-mute); font-size:13px;
  }

  footer{
    text-align:center; padding:24px 18px 8px; font-size:11px; color:var(--text-mute);
    font-family:var(--mono);
  }
</style>
</head>

function amapUrl(s){
  // 有詳細地址時優先用地址搜尋，定位更精準；沒有地址才退回店名+區域
  const keyword = encodeURIComponent(s.address ? `${s.name} ${s.address}` : `${s.name} ${s.area}`);
  const src = encodeURIComponent("厦门按摩会所指南");
  return `https://uri.amap.com/search?keyword=${keyword}&src=${src}`;
}

function getOvernightDetail(s){
  const base = s.name.split('（')[0].trim();
  return overnightDetails.find(d => d.baseName === base) || null;
}

  {baseName:"大腳丫足道", ok:false, overview:"❌全時段不可過夜", threshold:"無過夜權限，所有套餐均不提供過夜服務", timing:"套餐限 6 小時內，超時另計", overtime:"超過 6 小時未離開，按 20 元 / 人 / 小時收取超時費", benefit:"無過夜權益，僅可在公共休息區短暫休息，不可留宿", restriction:"20 年老連鎖，僅提供日間按摩服務，無過夜資質，不可留宿"},
  {baseName:"淺溪健康養生會所", ok:false, overview:"❌全時段不可過夜", threshold:"無過夜權限，所有套餐均不提供過夜服務", timing:"套餐限 5 小時內，超時另計", overtime:"超過 5 小時未離開，按 30 元 / 人 / 小時收取超時費", benefit:"無過夜權益，僅可在營業時間內消費", restriction:"泉州連鎖分店，僅提供日間按摩服務，無過夜資質"},
];

let currentArea = "全部";
let sortDesc = false;
let sortActive = false;
let overnightOnly = false;
let parkingOnly = false;
let favOnly = false;
let openIdx = null;

let favorites = new Set();
try{
  const stored = JSON.parse(localStorage.getItem('xm_massage_favs') || '[]');
  favorites = new Set(stored);
}catch(e){ favorites = new Set(); }
function saveFavorites(){
  try{ localStorage.setItem('xm_massage_favs', JSON.stringify(Array.from(favorites))); }catch(e){}
}

const areaFiltersEl = document.getElementById('areaFilters');
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('emptyState');
const countLabelEl = document.getElementById('countLabel');
const sortBtn = document.getElementById('sortBtn');
const sortLabel = document.getElementById('sortLabel');
const overnightBtn = document.getElementById('overnightBtn');
const parkingBtn = document.getElementById('parkingBtn');
const favBtn = document.getElementById('favBtn');

function renderFilters(){
  areaFiltersEl.innerHTML = uniqueAreas.map(a =>
    `<div class="chip ${a===currentArea?'active':''}" data-area="${a}">${a}</div>`
  ).join('');
  areaFiltersEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentArea = chip.dataset.area;
      openIdx = null;
      render();
    });
  });
}

function render(){
  renderFilters();
  let data = currentArea === "全部" ? shops.slice() : shops.filter(s=>s.area===currentArea);
  if(overnightOnly){
    data = data.filter(s=>s.overnight);
  }
  if(parkingOnly){
    data = data.filter(s=>s.parking.includes('免費'));
  }
  if(favOnly){
    data = data.filter(s=>favorites.has(s.no));
  }
  if(sortActive){
    data.sort((a,b)=> sortDesc ? b.priceMin - a.priceMin : a.priceMin - b.priceMin);
  }
  countLabelEl.textContent = `共 ${data.length} 家會所，點擊卡片展開詳情`;

  if(data.length === 0){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = data.map(s=>{
    const dots = Array.from({length:5}).map((_,i)=>
      `<span class="lv-dot" style="opacity:${i < s.levels ? .9 : .18}"></span>`
    ).join('');
    const hasPhone = !!s.phoneTel;
    const isFav = favorites.has(s.no);
    const ov = getOvernightDetail(s);
    const ovBlock = ov ? `
          <div class="ov-panel ${ov.ok?'':'no'}">
            <div class="ov-head">${ov.ok?'🌙':'☀️'} 過夜規則詳解</div>
            <div class="ov-overview">${ov.overview}</div>
            <div class="ov-item"><div class="ov-item-label">適用套餐門檻</div><div class="ov-item-val">${ov.threshold}</div></div>
            <div class="ov-item"><div class="ov-item-label">時段與停留時長</div><div class="ov-item-val">${ov.timing}</div></div>
            <div class="ov-item"><div class="ov-item-label">超時收費規則</div><div class="ov-item-val">${ov.overtime}</div></div>
            <div class="ov-item"><div class="ov-item-label">過夜權益</div><div class="ov-item-val">${ov.benefit}</div></div>
            <div class="ov-item"><div class="ov-item-label">特殊限制</div><div class="ov-item-val">${ov.restriction}</div></div>
          </div>` : '';
    return `
    <div class="card ${openIdx===s.no?'open':''}" data-no="${s.no}">
      <div class="card-head">
        <div class="idx">${String(s.no).padStart(2,'0')}</div>
        <div class="card-main">
          <div class="card-top">
            <div class="name">${s.name}</div>
            <div class="price">${s.price.split('(')[0].trim()}</div>
          </div>
          <div class="card-meta">
            <span class="area">${s.area}${s.address ? ' · ' + s.address : ''}</span>
          </div>
          <div class="card-meta">
            <span class="levels">${dots}</span>
            <span class="tag ${s.overnight?'yes':'no'}">${s.overnight?'可過夜':'不可過夜'}</span>
          </div>
        </div>
        <div class="fav-star ${isFav?'on':''}" data-fav="${s.no}">
          <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.6 6.1.6-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.6L12 3.5Z" stroke-linejoin="round"/></svg>
        </div>
        <div class="chevron">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3L9.5 7L5 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="body-inner">
          <div class="row"><div class="row-label">技師分級體系</div><div class="row-val">${s.levelDesc}</div></div>
          <div class="row"><div class="row-label">對應價格區間</div><div class="row-val">${s.price}</div></div>
          <div class="row"><div class="row-label">停留時長規則</div><div class="row-val">${s.stay}</div></div>
          <div class="row"><div class="row-label">自助詳情</div><div class="row-val">${s.buffet}</div></div>
          <div class="row"><div class="row-label">過夜政策</div><div class="row-val">${s.overnight?'✅ ':'❌ '}${s.overnightText}</div></div>
          <div class="row"><div class="row-label">核心特色</div><div class="row-val">${s.feature}</div></div>
          <div class="row"><div class="row-label">停車福利</div><div class="row-val">${s.parking}</div></div>
          <div class="row"><div class="row-label">門店地址</div><div class="row-val">${s.address || '暫無資料'}</div></div>
          <div class="row"><div class="row-label">聯絡電話</div><div class="row-val">${s.phone || '暫未找到'}</div></div>
          ${ovBlock}
          <div class="action-row">
            <a class="nav-btn" href="${amapUrl(s)}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.5 7.3 11.7a1 1 0 0 0 1.4 0C13 21.5 20 15.4 20 10c0-4.4-3.6-8-8-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg>
              高德導航
            </a>
            <a class="call-btn ${hasPhone?'':'disabled'}" href="tel:${s.phoneTel}">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 5c0-.6.4-1 1-1h3.2c.5 0 .9.3 1 .8l1 3.6c.1.4 0 .9-.4 1.1L7.8 10.7a13 13 0 0 0 5.5 5.5l1.2-2c.3-.4.7-.5 1.1-.4l3.6 1c.5.1.8.5.8 1V19c0 .6-.4 1-1 1h-2C10.5 20 4 13.5 4 6V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              ${hasPhone?'撥打電話':'無電話資料'}
            </a>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.card').forEach(card=>{
    card.querySelector('.card-head').addEventListener('click', (e)=>{
      if(e.target.closest('.fav-star')) return;
      const no = Number(card.dataset.no);
      openIdx = openIdx === no ? null : no;
      render();
    });
    card.querySelector('.fav-star').addEventListener('click', (e)=>{
      e.stopPropagation();
      const no = Number(card.dataset.no);
      if(favorites.has(no)){ favorites.delete(no); } else { favorites.add(no); }
      saveFavorites();
      render();
    });
  });
}

sortBtn.addEventListener('click', ()=>{
  if(!sortActive){ sortActive = true; sortDesc = false; }
  else { sortDesc = !sortDesc; }
  sortLabel.textContent = sortDesc ? "價格：高到低" : "價格：低到高";
  sortBtn.classList.toggle('desc', sortDesc);
  render();
});

overnightBtn.addEventListener('click', ()=>{
  overnightOnly = !overnightOnly;
  overnightBtn.classList.toggle('active', overnightOnly);
  render();
});

parkingBtn.addEventListener('click', ()=>{
  parkingOnly = !parkingOnly;
  parkingBtn.classList.toggle('active', parkingOnly);
  render();
});

favBtn.addEventListener('click', ()=>{
  favOnly = !favOnly;
  favBtn.classList.toggle('star-active', favOnly);
  render();
});

render();
</script>
</body>
</html>
