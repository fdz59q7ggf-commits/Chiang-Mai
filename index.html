<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清邁 8 天 7 夜行程規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A44; --navy-2:#24344F; --gold:#C9A227; --gold-dim:#E8D9A8;
  --coral:#E8622C; --coral-dim:#F6D3C2; --paper:#FBF7EC; --paper-2:#F1EAD8;
  --ink:#2A2118; --muted:#8A7F6D; --line:#E3D9C2; --danger:#B23A2E; --ok:#3C6E4C;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.6;}
h1,h2,h3,.serif{font-family:'Noto Serif TC',serif;}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 80px;}
header.hero{background:var(--navy);color:var(--paper);border-radius:16px;padding:28px 24px;margin-bottom:20px;position:relative;overflow:hidden;}
header.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--navy-2);opacity:.6;}
header.hero h1{font-size:22px;font-weight:700;margin:0 0 6px;position:relative;}
header.hero .sub{font-size:13px;color:var(--gold-dim);position:relative;}
.hero-edit{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;position:relative;}
.hero-edit input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;}
.hero-edit input::placeholder{color:rgba(255,255,255,.5);}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
nav.tabs button{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:13px;cursor:pointer;transition:.15s;}
nav.tabs button.active{background:var(--navy);border-color:var(--navy);color:var(--paper);}
nav.tabs button:hover:not(.active){border-color:var(--gold);color:var(--ink);}
.panel{display:none;}
.panel.active{display:block;}
.daytabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;border-bottom:2px solid var(--line);}
.daytabs button{flex:none;padding:8px 14px 10px;border:none;background:none;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.daytabs button.active{color:var(--navy);font-weight:700;border-bottom-color:var(--coral);}
.day-theme{background:var(--paper-2);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--navy-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.day-theme input{flex:1;min-width:200px;background:transparent;border:none;border-bottom:1px dashed var(--line);font-family:inherit;font-size:13px;color:var(--navy-2);padding:2px 0;}
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
.item{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.item.pinned{border-color:var(--gold);background:linear-gradient(0deg,#fff,#fff),linear-gradient(0deg,#FFF9E8,#FFF9E8);box-shadow:0 0 0 1px var(--gold) inset;}
.item::before{content:"";position:absolute;left:-21px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--navy);border:2px solid var(--paper);}
.item.pinned::before{background:var(--gold);}
.item-row1{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.time-input{width:76px;font-weight:700;color:var(--navy);border:none;background:var(--paper-2);border-radius:6px;padding:5px 6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;text-align:center;}
.title-input{flex:1;min-width:140px;border:none;border-bottom:1px solid transparent;background:transparent;font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;color:var(--ink);padding:4px 2px;}
.title-input:focus,.time-input:focus{outline:none;border-bottom:1px solid var(--coral);}
.map-btn{flex:none;text-decoration:none;font-size:15px;background:var(--paper-2);border-radius:999px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:.15s;}
.map-btn:hover{background:var(--coral-dim);border-color:var(--coral);}
.pin-badge{display:flex;align-items:center;gap:4px;font-size:11px;color:#8A6D06;background:var(--gold-dim);border-radius:999px;padding:3px 9px;flex:none;cursor:pointer;border:none;font-weight:700;}
.pin-badge.off{background:var(--paper-2);color:var(--muted);}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;flex:none;padding:2px 6px;border-radius:6px;}
.del-btn:hover{color:var(--danger);background:#FBEAF0;}
.del-btn:disabled{opacity:.25;cursor:not-allowed;}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;}
.item-grid label{display:block;color:var(--muted);font-size:11px;margin-bottom:2px;}
.item-grid input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12.5px;background:var(--paper);}
.item-grid textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12.5px;background:var(--paper);resize:vertical;min-height:32px;grid-column:1/-1;}
.add-item{width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:12px;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;margin-top:4px;}
.add-item:hover{border-color:var(--coral);color:var(--coral);}
.note-preview{grid-column:1/-1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper);font-size:12.5px;line-height:1.6;cursor:pointer;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;}
.note-preview.empty{color:var(--muted);}
.note-more{grid-column:1/-1;font-size:11.5px;color:var(--coral);cursor:pointer;margin-top:-4px;background:none;border:none;text-align:left;padding:0;font-family:inherit;}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(27,42,68,.55);padding:16px;}
.modal.open{display:flex;}
#driver{position:fixed;inset:0;z-index:200;background:#fffaf3;display:none;flex-direction:column;overflow:auto;}
#driver.open{display:flex;}
#driver .dhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
#driver .dhead button{font-size:16px;padding:8px 16px;border-radius:999px;border:none;background:var(--navy);color:var(--paper);font-family:inherit;cursor:pointer;}
#driver .dbody{padding:16px;max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;color:#1b2a44;}
#driver .please{font-size:22px;color:#6b7280;}
#driver .thname{font-size:clamp(30px,7vw,52px);font-weight:800;line-height:1.25;}
#driver .thnear{font-size:clamp(22px,5vw,32px);color:var(--coral);font-weight:700;}
#driver .thaddr{font-size:clamp(22px,5.5vw,34px);font-weight:700;line-height:1.4;padding:12px 14px;border:2px solid var(--coral);border-radius:12px;background:#fff;white-space:pre-line;}
#driver .thaddr small{display:block;font-size:16px;font-weight:400;color:#6b7280;}
#driver .zh{font-size:14px;color:#6b7280;}
#driver iframe{width:100%;height:48vh;min-height:280px;border:1px solid var(--line);border-radius:12px;}
#driver .big.apple{background:#1b2a44;}
#driver .big{display:block;text-align:center;font-size:20px;font-weight:700;text-decoration:none;color:#fff;background:var(--coral);border-radius:12px;padding:14px;}
.modal-card{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper-2);}
.modal-head h3{margin:0;font-size:15px;flex:1;line-height:1.4;}
.modal-close{border:none;background:var(--navy);color:var(--paper);border-radius:999px;padding:6px 14px;font-family:inherit;font-size:13px;cursor:pointer;flex:none;}
.modal-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-body textarea{width:100%;min-height:45vh;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;line-height:1.7;background:var(--paper);resize:vertical;}
.modal-body .link-chips{margin-top:10px;}
@media (max-width:680px){.modal{padding:0;align-items:flex-end;}.modal-card{max-width:none;max-height:92vh;border-radius:16px 16px 0 0;}.modal-body textarea{min-height:40vh;}}
.link-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.link-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--coral);background:var(--coral-dim);border:1px solid var(--coral);border-radius:999px;padding:3px 12px;text-decoration:none;transition:.15s;}
.link-chip:hover{background:var(--coral);color:#fff;}
.book-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#fff;background:var(--danger);border-radius:999px;padding:3px 10px;flex:none;cursor:default;border:none;}
.book-badge:hover{background:#922d22;}
.swap-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FFF4EC;border:1px solid var(--coral-dim);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--navy-2);}
.swap-now{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;}
.swap-now h3{margin:0 0 8px;font-size:15px;color:var(--navy);}
.swap-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.swap-row b{flex:none;color:var(--navy);min-width:72px;}
.swap-row span{flex:1;min-width:160px;}
.swap-actions{margin-top:10px;}
.trip-section{font-size:16px;color:var(--navy);margin:22px 0 10px;}
.trip-day{font-size:13px;font-weight:700;color:var(--navy);margin:6px 0 4px;}
.trip-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px;}
.trip-card.orig{background:var(--paper-2);}
.trip-card.on{border-color:var(--coral);}
.trip-card summary{cursor:pointer;padding:12px 0;list-style-position:outside;}
.trip-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;color:var(--ink);display:inline;}
.trip-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.trip-on{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:var(--coral);border-radius:999px;padding:1px 8px;}
.trip-book{font-size:12.5px;background:#FFF9E8;border:1px solid var(--gold-dim);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
.trip-items{margin:0 0 10px;padding-left:20px;font-size:13px;}
.trip-items li{margin-bottom:4px;}
.trip-items small{display:block;color:var(--muted);font-size:11.5px;}
.trip-swap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;padding-bottom:12px;}
.trip-swap .btn.here{background:var(--coral-dim);border-color:var(--coral);color:var(--ink);cursor:default;}
.day-total{text-align:right;font-size:12px;color:var(--muted);margin:10px 2px 0;}
table.simple{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);table-layout:fixed;}
table.simple th{background:var(--navy);color:var(--paper);font-size:12px;font-weight:500;text-align:left;padding:8px 10px;word-break:break-word;}
table.simple td{padding:0;border-bottom:1px solid var(--line);vertical-align:top;}
table.simple td textarea{width:100%;border:none;background:none;padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;display:block;line-height:1.6;}
table.simple td textarea:focus{outline:2px solid var(--coral-dim);background:#fff;}
table.simple tr:last-child td{border-bottom:none;}
@media (max-width:680px){
  table.simple thead{display:none;}
  table.simple, table.simple tbody, table.simple tr, table.simple td{display:block;width:100%;}
  table.simple tr{border-bottom:2px solid var(--line);padding:10px 0;position:relative;}
  table.simple td{border-bottom:none;padding:2px 10px;}
  table.simple td[data-label]::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:6px;}
  table.simple td:first-child[data-label]::before{margin-top:0;}
  table.simple td:last-child{position:absolute;top:10px;right:6px;padding:0;}
}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px;}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--navy);}
.btn.primary{background:var(--coral);color:#fff;border-color:var(--coral);}
.btn.primary:hover{background:#CF5222;}
.btn.danger{color:var(--danger);}
.hint{font-size:12px;color:var(--muted);margin:0 0 14px;}
.summary-card{background:var(--navy);color:var(--paper);border-radius:12px;padding:16px 20px;margin-bottom:18px;display:flex;gap:24px;flex-wrap:wrap;}
.summary-card div b{display:block;font-family:'Noto Serif TC',serif;font-size:20px;color:var(--gold-dim);}
.summary-card div span{font-size:11px;color:rgba(255,255,255,.7);}
footer{text-align:center;font-size:11px;color:var(--muted);margin-top:30px;}
@media print{
  nav.tabs,.toolbar,.add-item,.del-btn,.pin-badge{display:none!important;}
  .panel{display:block!important;}
  .daytabs{display:none!important;}
  body{background:#fff;}
  .item{break-inside:avoid;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1 class="serif" id="tripTitleDisplay">清邁 8 天 7 夜行程規劃</h1>
    <div class="sub" id="tripSubDisplay">2026/11/11（三）→ 11/18（三）｜6 人全程包車</div>
    <div class="hero-edit">
      <input id="metaTitle" placeholder="行程標題" />
      <input id="metaRange" placeholder="日期範圍" />
      <input id="metaPeople" placeholder="人數/交通方式" />
    </div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnExport"><i>⭳</i>匯出 JSON 存檔</button>
    <label class="btn" style="cursor:pointer;">⭱ 匯入 JSON<input type="file" id="fileImport" accept="application/json" style="display:none;"></label>
    <button class="btn" id="btnPrint">🖨 列印 / 存成 PDF</button>
    <button class="btn danger" id="btnReset">↺ 還原成預設行程</button>
  </div>
  <p class="hint">此頁面完全在你的瀏覽器裡運作，重新整理頁面會回到最初版本 — 修改後記得按「匯出 JSON 存檔」，下次用「匯入 JSON」把檔案讀回來即可繼續編輯（「🔄 一日遊選單」換過的天數這支手機會記住）。標示 <span style="color:#8A6D06;">★ 必去</span> 的項目已鎖定，需先取消釘選才能刪除。</p>

  <nav class="tabs" id="mainTabs"></nav>

  <div id="panels"></div>

  <footer>清邁行程規劃 · 純前端本機編輯，資料不會上傳到任何伺服器</footer>
</div>

<div id="driver" role="dialog" aria-modal="true">
  <div class="dhead"><b>🛺 給司機看</b><button onclick="closeDriver()">關閉 ✕</button></div>
  <div class="dbody">
    <div class="please">กรุณาไปส่งที่นี่ครับ/ค่ะ 🙏</div>
    <div class="thname" id="dName"></div>
    <div class="thnear" id="dNear"></div>
    <div class="thaddr" id="dAddr"></div>
    <div class="zh" id="dZh"></div>
    <iframe id="dMap" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="แผนที่"></iframe>
    <a class="big" id="dOpen" target="_blank" rel="noopener">เปิดใน Google Maps（泰文導航）</a>
    <a class="big apple" id="dApple" target="_blank" rel="noopener">เปิดใน Apple Maps（Apple 地圖）</a>
  </div>
</div>

<div class="modal" id="noteModal" onclick="if(event.target===this)closeNoteModal()">
  <div class="modal-card">
    <div class="modal-head"><h3></h3><button class="modal-close" onclick="closeNoteModal()">關閉 ✕</button></div>
    <div class="modal-body"><textarea placeholder="備註"></textarea><div class="modal-links"></div></div>
  </div>
</div>
<script>
const uid = (()=>{let n=0;return ()=>'id'+(n++)+'_'+Math.random().toString(36).slice(2,7);})();

function defaultData(){
  const mk = (time,title,location,note,cost,pinned,map,booking)=>({id:uid(),time,title,location,note:note||"",cost:cost||"",pinned:!!pinned,map:map||"",booking:booking||""});
  return {
    meta:{ title:"清邁 8 天 7 夜行程規劃", range:"2026/11/11（三）→ 11/18（三）", people:"6 人全程包車" },
    days:[
      {date:"11/11",weekday:"三",theme:"抵達清邁＋從塔佩門出發慢慢逛古城（Akha Ama Coffee→契迪龍寺→帕辛寺）＋Health Land 按摩＋長康路夜市",stay:"清邁 Loi Kroh Road（已訂）",items:[
        mk("07:20","桃園機場起飛","桃園機場","飛行約3.5～4小時，泰國比台灣慢1小時","—",false,"https://www.google.com/maps/search/?api=1&query=Taoyuan+International+Airport&hl=en"),
        mk("~10:30","抵達清邁機場(CNX)，包車接機","清邁機場","車程約15～20分鐘到民宿","—",false,"https://www.google.com/maps/search/?api=1&query=Chiang+Mai+International+Airport&hl=en"),
        mk("11:00","民宿 Check-in / 寄放行李","民宿（147/2 Loi Kroh Road，長康路夜市旁，座標 18°47'01.9\"N 99°00'07.6\"E）","近長康路夜市","—",false,"https://www.google.com/maps/search/?api=1&query=18.783861,99.002111&hl=en"),
        mk("12:00","午餐：Lemongrass Thai Cuisine","Loi Kroh Rd","推薦 Khao Soi 泰北咖哩麵、香蕉捲","150～250",false,"https://www.google.com/maps/search/?api=1&query=Lemongrass+Thai+Cuisine+Loi+Kroh+Road+Chiang+Mai&hl=en"),
        mk("13:15","🚶 古城慢慢逛起點：塔佩門 Tha Phae Gate","古城東門（從民宿步行約15分鐘，約1公里）","下午用走的慢慢逛，不用趕：先在塔佩門城牆、鴿子廣場拍照，看看護城河，約30～40分鐘","免費",false,"https://www.google.com/maps/search/?api=1&query=Tha+Phae+Gate+Chiang+Mai&hl=en"),
        mk("14:10","★ Akha Ama Coffee (The New Original)","Moonmueang Soi 9, 古城北區（塔佩門往北沿護城河內側走約10分鐘）","必去！阿卡族咖啡，單品咖啡60～150銖，營業08:00-17:00；坐下來慢慢喝、休息約40分鐘","80～150",true,"https://www.google.com/maps/search/?api=1&query=Akha+Ama+Coffee+The+New+Original+Chiang+Mai&hl=en"),

let PLANS = null;
function getPlans(){ return PLANS || (PLANS = dayTripPlans()); }
function getPlan(id){ return getPlans().find(p=>p.id===id); }

let swaps = {};
function loadSwaps(){
  try{ swaps = JSON.parse(localStorage.getItem(SWAP_KEY) || '{}') || {}; }catch(e){ swaps = {}; }
  // 分享連結：#swap=11-12:lampang,11-16:relax
  const m = location.hash.match(/swap=([^&]*)/);
  if(m){
    swaps = {};
    decodeURIComponent(m[1]).split(',').forEach(pair=>{
      const [d, id] = pair.split(':');
      const date = (d||'').replace('-','/');
      if(validSwap(date, id)) swaps[date] = id;
    });
    saveSwaps();
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  }
  Object.keys(swaps).forEach(d=>{ if(!validSwap(d, swaps[d])) delete swaps[d]; });
}
function validSwap(date, id){ return (SWAP_DATES.includes(date) && !!getPlan(id)) || (date===CR_KEY && !!getCrPlan(id)); }
function saveSwaps(){ try{ localStorage.setItem(SWAP_KEY, JSON.stringify(swaps)); }catch(e){} }
function currentPlanId(date){ return swaps[date] || 'orig-'+date; }
function applyPlanToDay(date){
  const day = state.days.find(d=>d.date===date);
  const p = getPlan(currentPlanId(date));
  if(!day || !p) return;
  day.theme = p.theme;
  day.items = p.items.map(it=>Object.assign({}, it, {id:uid()}));
}
function applySwaps(){ Object.keys(swaps).forEach(d=>{ if(d===CR_KEY) applyCr(); else applyPlanToDay(d); }); }
function weekdayOf(date){ const d = state.days.find(x=>x.date===date); return d ? d.weekday : ''; }
function planWarning(p, date){
  const wd = weekdayOf(date);
  if(p.only && p.only!==wd) return p.onlyNote || ('這個行程適合週' + p.only);
  if(p.closed && p.closed[wd]) return p.closed[wd];
  return '';
}
function assignPlan(date, pid){
  const cur = currentPlanId(date);
  if(cur===pid) return;
  const other = SWAP_DATES.find(d=>d!==date && currentPlanId(d)===pid);
  const p = getPlan(pid);
  let msg = date + '(' + weekdayOf(date) + ') 要換成「' + p.short + '」嗎？';
  if(other) msg += '\n\n這個行程原本在 ' + other + '，' + other + ' 會換成 ' + date + ' 原本的「' + getPlan(cur).short + '」（兩天互換）。';
  const w1 = planWarning(p, date), w2 = other ? planWarning(getPlan(cur), other) : '';
  if(w1) msg += '\n\n⚠️ ' + w1;
  if(w2) msg += '\n\n⚠️ ' + other + '：' + w2;
  msg += '\n\n（這天在網頁上自己改過的內容會被蓋掉；隨時可以從選單換回原定行程）';
  if(!confirm(msg)) return;
  swaps[date] = pid;
  if(other) swaps[other] = cur;
  SWAP_DATES.forEach(d=>{ if(swaps[d]==='orig-'+d) delete swaps[d]; });
  saveSwaps();
  applyPlanToDay(date);
  if(other) applyPlanToDay(other);
  renderAll();
}
function shareSwapsUrl(){
  const s = SWAP_DATES.concat([CR_KEY]).filter(d=>swaps[d]).map(d=>d.replace('/','-')+':'+swaps[d]).join(',');
  return location.origin + location.pathname + location.search + (s ? '#swap=' + s : '');
}

let CR_PLANS = null;
function getCrPlans(){ return CR_PLANS || (CR_PLANS = crPlans()); }
function getCrPlan(id){ return getCrPlans().find(p=>p.id===id); }
function crCurrentId(){ return swaps[CR_KEY] || 'cr-orig'; }
function applyCr(){
  const p = getCrPlan(crCurrentId());
  [['11/13','theme13','items13'],['11/14','theme14','items14']].forEach(([date, th, its])=>{
    const day = state.days.find(d=>d.date===date);
    if(!day || !p) return;
    day.theme = p[th];
    day.items = p[its].map(it=>Object.assign({}, it, {id:uid()}));
  });
}
function assignCr(id){
  if(crCurrentId()===id) return;
  const p = getCrPlan(id);
  if(!confirm('清萊兩天（11/13～11/14）要換成「' + p.short + '」嗎？\n\n住 Wilacha 不變；11/14 晚上回清邁的 Fah Lanna 按摩＋週六步行街也不變。\n\n（這兩天在網頁上自己改過的內容會被蓋掉；隨時可以換回原定）')) return;
  if(id==='cr-orig') delete swaps[CR_KEY]; else swaps[CR_KEY] = id;
  saveSwaps();
  applyCr();
  renderAll();
}

function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const urlRegex = /https?:\/\/[^\s，。、）)」」】\]]+/g;
function extractUrls(text){
  if(!text) return [];
  const matches = String(text).match(urlRegex);
  return matches ? [...new Set(matches)] : [];
}
function renderLinkChips(urls){
  if(!urls || !urls.length) return '';
  return '<div class="link-chips">' + urls.map((u,i)=>
    `<a class="link-chip" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">🔗 連結${urls.length>1?' '+(i+1):''}</a>`
  ).join('') + '</div>';
}

function parseCostMid(cost){
  if(!cost) return 0;
  const nums = String(cost).replace(/,/g,'').match(/\d+(\.\d+)?/g);
  if(!nums) return 0;
  const vals = nums.map(Number);
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function renderDaysPanel(){
  const wrap = document.createElement('div');

  const realDays = state.days.filter(d=>!d.date.startsWith('備') && !d.date.startsWith('按摩'));
  const totalTrip = realDays.reduce((sum,d)=>sum+d.items.reduce((s,it)=>s+parseCostMid(it.cost),0),0);
  const totalItems = realDays.reduce((s,d)=>s+d.items.length,0);
  const summary = document.createElement('div');
  summary.className = 'summary-card';
  summary.innerHTML = `
    <div><b>${realDays.length}</b><span>天行程</span></div>
    <div><b>${totalItems}</b><span>個安排項目</span></div>
    <div><b>~${Math.round(totalTrip).toLocaleString()}</b><span>銖／人・全程估計（粗估，不含住宿包車）</span></div>`;
  wrap.appendChild(summary);

  const dtabs = document.createElement('div');
  dtabs.className = 'daytabs';
  dtabs.innerHTML = state.days.map((d,i)=>{
    const label = (d.date.startsWith('備') || d.date.startsWith('按摩')) ? d.date : `Day${i+1} ${d.date}(${d.weekday})`;
    return `<button data-i="${i}" class="${i===activeDay?'active':''}">${label}</button>`;
  }).join('');
  dtabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ activeDay=+b.dataset.i; renderAll(); }));
  wrap.appendChild(dtabs);
  // 點擊後將作用中分頁捲動到可見範圍中央，避免備用天被擠到右邊看不到
  requestAnimationFrame(()=>{
    const activeBtn = dtabs.querySelector('button.active');
    if(activeBtn){
      const target = activeBtn.offsetLeft + activeBtn.offsetWidth/2 - dtabs.offsetWidth/2;
      dtabs.scrollLeft = Math.max(0, target);
    }
  });

  const day = state.days[activeDay];
  if(SWAP_DATES.includes(day.date)){
    const banner = document.createElement('div');
    banner.className = 'swap-banner';
    banner.innerHTML = `<span>🔄 這天可以前一天再換成別的一日遊（目前：${esc(getPlan(currentPlanId(day.date)).short)}）</span><button class="btn">看一日遊選單</button>`;
    banner.querySelector('button').addEventListener('click',()=>{ activeMainTab='trips'; renderAll(); window.scrollTo(0,0); });
    wrap.appendChild(banner);
  } else if(day.date==='11/13' || day.date==='11/14'){
    const banner = document.createElement('div');
    banner.className = 'swap-banner';
    banner.innerHTML = `<span>🔄 清萊兩天可以換別的玩法，住 Wilacha 不變（目前：${esc(getCrPlan(crCurrentId()).short)}）</span><button class="btn">看清萊選單</button>`;
    banner.querySelector('button').addEventListener('click',()=>{ activeMainTab='trips'; renderAll(); const h = [...document.querySelectorAll('.trip-section')].pop(); if(h) h.scrollIntoView(); });
    wrap.appendChild(banner);
  }
  const themeBar = document.createElement('div');
  themeBar.className = 'day-theme';
  themeBar.innerHTML = `<input data-f="theme" value="${esc(day.theme)}" placeholder="這天的主題" /><input data-f="stay" value="${esc(day.stay)}" placeholder="住宿地" style="max-width:220px;" />`;
  themeBar.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',e=>{ day[e.target.dataset.f]=e.target.value; });
  });
  wrap.appendChild(themeBar);

  const timeline = document.createElement('div');
  timeline.className = 'timeline';
  day.items.forEach((it,idx)=>{
    timeline.appendChild(renderItem(day, it, idx));
  });
  wrap.appendChild(timeline);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-item';
  addBtn.textContent = '+ 新增這天的行程項目';
  addBtn.addEventListener('click',()=>{
    day.items.push({id:uid(),time:'00:00',title:'新行程',location:'',note:'',cost:'',pinned:false});
    renderAll();
  });
  wrap.appendChild(addBtn);

  if(!day.date.startsWith('備') && !day.date.startsWith('按摩')){
    const dayTotal = day.items.reduce((s,it)=>s+parseCostMid(it.cost),0);
    const totalLine = document.createElement('div');
    totalLine.className = 'day-total';
    totalLine.textContent = `本日估計花費：~${Math.round(dayTotal).toLocaleString()} 銖／人（粗估）`;
    wrap.appendChild(totalLine);
  } else if(day.date.startsWith('按摩')){
    const totalLine = document.createElement('div');
    totalLine.className = 'day-total';
    totalLine.textContent = 'Klook按摩/SPA資訊，可隨時替換主行程中的按摩安排';
    wrap.appendChild(totalLine);
  } else {
    const totalLine = document.createElement('div');
    totalLine.className = 'day-total';
    totalLine.textContent = '備用行程，可隨時替換主行程中的任何半天';
    wrap.appendChild(totalLine);
  }

  return wrap;
}

function cleanForQuery(s){
  return String(s||'').replace(/[★☆💆💇🏮⚠️~🔫]/gu,'').replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
}
function autoMapUrl(it){
  const q = [cleanForQuery(it.title), cleanForQuery(it.location)].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q + ' Thailand') + '&hl=en';
}

// Apple 地圖用地址搜尋（Google 地圖搜同一個地址會跑錯，Apple 地圖找得到）
function appleMapUrl(addr){ return 'https://maps.apple.com/?address=' + encodeURIComponent(addr); }
function findThai(text){
  for (const [re, th, near, addr] of THAI_PLACES) if (re.test(text)) return {th, near, addr};
  return null;
}
function openDriver(title, location, url){
  const m = findThai(title) || findThai(location || '');
  document.getElementById('dName').textContent = m ? m.th : title;
  document.getElementById('dNear').textContent = m && m.near ? '📍 ' + m.near : (location ? '📍 ' + location : '');
  const dAddr = document.getElementById('dAddr');
  dAddr.innerHTML = m && m.addr ? 'ที่อยู่: ' + esc(m.addr.th) + '<small>' + esc(m.addr.en) + '</small>' : '';
  dAddr.style.display = m && m.addr ? '' : 'none';
  const dApple = document.getElementById('dApple');
  dApple.href = m && m.addr ? appleMapUrl(m.addr.th) : '#';
  dApple.style.display = m && m.addr ? '' : 'none';
  document.getElementById('dZh').textContent = title + (location ? '｜' + location : '');
  const q = (url.match(/[?&]query=([^&]*)/) || [])[1];
  document.getElementById('dMap').src = q ? 'https://maps.google.com/maps?q=' + q + '&hl=th&z=16&output=embed' : 'about:blank';
  document.getElementById('dMap').style.display = q ? '' : 'none';
  document.getElementById('dOpen').href = url;
  document.getElementById('driver').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDriver(){
  document.getElementById('driver').classList.remove('open');
  document.getElementById('dMap').src = 'about:blank';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape' && document.getElementById('driver').classList.contains('open')) closeDriver(); });

// 給司機看：同一個地圖連結改成泰文介面（hl=th）
function thaiMapUrl(u){
  if(!/google\.[a-z.]+\/maps/.test(u)) return u;
  return /[?&]hl=/.test(u) ? u.replace(/([?&])hl=[^&]*/, '$1hl=th') : u + (u.includes('?') ? '&' : '?') + 'hl=th';
}

      <div class="note-links" style="grid-column:1/-1;">${renderLinkChips(extractUrls(it.note))}</div>

  el.querySelector('.th-btn').addEventListener('click', e=>{
    e.preventDefault();
    openDriver(cleanForQuery(it.title) || it.title, it.location, el.querySelector('.th-btn').href);
  });
  el.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const f = e.target.dataset.f;
      it[f]=e.target.value;
      if(f==='title' || f==='location' || f==='map'){
        const u = it.map ? it.map : autoMapUrl(it);
        el.querySelector('.map-btn').href = u;
        el.querySelector('.th-btn').href = thaiMapUrl(u);
      }
      if(f==='booking'){
        let bBtn = el.querySelector('.book-btn');
        if(it.booking){
          if(!bBtn){
            bBtn = document.createElement('a');
            bBtn.className = 'map-btn book-btn';
            bBtn.target = '_blank';
            bBtn.rel = 'noopener';
            bBtn.title = '預約／購票連結';
            bBtn.textContent = '🎫';
            el.querySelector('.th-btn').after(bBtn);
          }
          bBtn.href = it.booking;
        } else if(bBtn){
          bBtn.remove();
        }
      }
    });
  });
  el.querySelectorAll('[data-act="note"]').forEach(b=>b.addEventListener('click',()=>{
    openNoteModal(it, ()=>{
      const pv = el.querySelector('.note-preview');
      pv.textContent = it.note || '點此新增備註';
      pv.classList.toggle('empty', !it.note);
      el.querySelector('.note-more').textContent = it.note ? '🔍 點開看完整備註／編輯' : '✏️ 新增備註';
      const linksDiv = el.querySelector('.note-links');

  el.querySelector('[data-act="pin"]').addEventListener('click',()=>{ it.pinned=!it.pinned; renderAll(); });
  el.querySelector('[data-act="del"]').addEventListener('click',()=>{
    if(it.pinned) return;
    day.items = day.items.filter(x=>x.id!==it.id);
    renderAll();
  });
  return el;
}

const MAP_COLS = {food:[0,4], breakfast:[1,null], seafood:[0,3], massage:[0,4]};
function placeMapUrl(name, addr){
  const q = [cleanForQuery(name), cleanForQuery(addr)].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q + ' Chiang Mai Thailand') + '&hl=en';
}
function buildSimpleTable(headers, rows, onEdit, onDelete, mapCols){
  const table = document.createElement('table');
  table.className = 'simple';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr>' + headers.map(h=>`<th>${esc(h)}</th>`).join('') + '<th style="width:36px;"></th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach((row,ri)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = row.map((cell,ci)=>`<td data-label="${esc(headers[ci])}"><textarea rows="1" data-r="${ri}" data-c="${ci}">${esc(cell)}</textarea></td>`).join('') +
      `<td data-label=""><button class="del-btn" data-del="${ri}">✕</button></td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  if(mapCols){
    const [nc, ac] = mapCols;
    tbody.querySelectorAll('tr').forEach((tr,ri)=>{
      const cell = tr.children[nc];
      const a = document.createElement('a');
      a.className = 'link-chip';
      a.target = '_blank'; a.rel = 'noopener';
      a.title = '在 Google Map 開啟';
      a.textContent = '📍 地圖';
      const t = document.createElement('a');
      t.className = 'link-chip';
      t.target = '_blank'; t.rel = 'noopener';
      t.title = '給司機看：泰文 Google 地圖';
      t.textContent = '🛺 泰文';
      t.style.marginLeft = '4px';
      const upd = ()=>{ a.href = placeMapUrl(rows[ri][nc], ac!=null ? rows[ri][ac] : ''); t.href = thaiMapUrl(a.href); };
      upd();
      cell.appendChild(a);
      t.addEventListener('click', e=>{ e.preventDefault(); openDriver(rows[ri][nc], ac!=null ? rows[ri][ac] : '', t.href); });
      cell.appendChild(t);
      cell.querySelector('textarea').addEventListener('input', upd);
      if(ac!=null) tr.children[ac].querySelector('textarea').addEventListener('input', upd);
    });
  }
  table.querySelectorAll('textarea').forEach(ta=>{
    autosize(ta);
    // 若 cell 含 URL，加入可點擊連結按鈕
    const urls = extractUrls(ta.value);
    if(urls.length){
      const chips = document.createElement('div');
      chips.className = 'link-chips cell-links';
      chips.innerHTML = renderLinkChips(urls);
      ta.after(chips);
    }
    ta.addEventListener('input',e=>{
      onEdit(+e.target.dataset.r, +e.target.dataset.c, e.target.value);
      autosize(e.target);
      // 即時更新連結按鈕
      const urls2 = extractUrls(e.target.value);
      let chips = e.target.parentElement.querySelector('.cell-links');
      if(urls2.length){
        if(!chips){
          chips = document.createElement('div');
          chips.className = 'link-chips cell-links';
          e.target.after(chips);
        }
        chips.innerHTML = renderLinkChips(urls2);
      } else if(chips){
        chips.remove();
      }
    });
  });
  table.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click',()=>onDelete(+b.dataset.del));
  });
  return table;
}

    const addBtn4=document.createElement('button');
    addBtn4.className='add-item';
    addBtn4.textContent='+ 新增一家店家';
    addBtn4.addEventListener('click',()=>{ data.vendors.rows.push(data.vendors.headers.map(()=>'')); renderAll(); });
    wrap.appendChild(addBtn4);
  }

  if(key==='car' && data.recommendation){
    const h3d = document.createElement('h3');
    h3d.className='serif';
    h3d.style.fontSize='15px';
    h3d.style.margin='24px 0 10px';
    h3d.textContent = '6人包車建議方案總結';
    wrap.appendChild(h3d);
    const t5 = buildSimpleTable(data.recommendation.headers, data.recommendation.rows,
      (ri,ci,val)=>{ data.recommendation.rows[ri][ci] = val; },
      (ri)=>{ data.recommendation.rows.splice(ri,1); renderAll(); }
    );
    wrap.appendChild(t5);
    if(data.recommendation.tip){
      const tip2 = document.createElement('p');
      tip2.className = 'hint';
      tip2.style.marginTop='12px';
      tip2.textContent = data.recommendation.tip;
      wrap.appendChild(tip2);
    }
  }

  return wrap;
}

function renderAll(){
  renderMeta();
  renderTabs();
  renderPanels();
}

document.getElementById('btnExport').addEventListener('click',()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '清邁行程_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('fileImport').addEventListener('change',e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.days || !data.meta) throw new Error('格式不符');
      state = data;
      swaps = {}; saveSwaps();
      activeDay = 0;
      renderAll();
    }catch(err){
      alert('匯入失敗，請確認這是本頁面匯出的 JSON 檔案。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('btnPrint').addEventListener('click',()=>window.print());

document.getElementById('btnReset').addEventListener('click',()=>{
  if(!confirm('確定要還原成最初版本嗎？目前的修改會消失（建議先匯出 JSON 備份）。')) return;
  state = JSON.parse(JSON.stringify(defaultData()));
  swaps = {}; saveSwaps();
  activeDay = 0;
  activeMainTab = 'days';
  renderAll();
});

loadSwaps();
applySwaps();
renderAll();
</script>
</body>
</html>
